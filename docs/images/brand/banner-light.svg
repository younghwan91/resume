    <rect x="706" y="60" width="246" height="14" fill="url(#res-bl-grad)"/>
    <rect x="726" y="44" width="110" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="726" y="58" width="150" height="4" rx="2" fill="#A5B4FC"/>
    <circle cx="924" cy="52" r="6" fill="#34D399"/>

    <!-- Section 1: Experience -->
    <rect x="726" y="90" width="64" height="5" rx="2.5" fill="#4F46E5"/>
    <line x1="726" y1="100" x2="932" y2="100" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="726" y="108" width="180" height="5" rx="2.5" fill="#334155"/>
    <rect x="726" y="119" width="196" height="4" rx="2" fill="#94A3B8"/>
    <rect x="726" y="128" width="164" height="4" rx="2" fill="#94A3B8"/>

    <!-- Section 2: Publications & Patents -->
    <rect x="726" y="148" width="84" height="5" rx="2.5" fill="#4F46E5"/>
    <line x1="726" y1="158" x2="932" y2="158" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="730" cy="170" r="2.5" fill="#34D399"/>
    <rect x="740" y="167.5" width="170" height="5" rx="2.5" fill="#475569"/>
    <circle cx="730" cy="183" r="2.5" fill="#34D399"/>
    <rect x="740" y="180.5" width="150" height="5" rx="2.5" fill="#475569"/>

    <!-- Section 3: Skills -->
    <rect x="726" y="202" width="54" height="5" rx="2.5" fill="#4F46E5"/>
    <line x1="726" y1="212" x2="932" y2="212" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="726" y="220" width="48" height="14" rx="7" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
    <rect x="780" y="220" width="56" height="14" rx="7" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1"/>
    <rect x="842" y="220" width="52" height="14" rx="7" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>

    <!-- Floating TeX badge -->
    <rect x="974" y="180" width="160" height="52" rx="10" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="992" y="203" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700">\documentclass</text>
    <text x="992" y="220" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ 4 PDFs released</text>
  </g>
