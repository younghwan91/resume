<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none" role="img" aria-label="Younghwan Chae — Résumé">
  <defs>
    <linearGradient id="res-bl-card" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="res-bl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#res-bl-card)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Subtle grid -->
  <g stroke="#4F46E5" stroke-opacity="0.05" stroke-width="1">
    <path d="M660 0 V280 M720 0 V280 M780 0 V280 M840 0 V280 M900 0 V280 M960 0 V280 M1020 0 V280 M1080 0 V280 M1140 0 V280"/>
    <path d="M620 56 H1200 M620 112 H1200 M620 168 H1200 M620 224 H1200"/>
  </g>

  <!-- Brand mark (64x64 at 56,52) -->
  <g transform="translate(56, 52)">
    <rect width="64" height="64" rx="14" fill="url(#res-bl-grad)"/>
    <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M20 14 H36 L44 22 V48 C44 49.1 43.1 50 42 50 H20 C18.9 50 18 49.1 18 48 V16 C18 14.9 18.9 14 20 14 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M36 14 V22 H44" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M24 29 H38 M24 36 H38 M24 43 H33" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="43" r="2.2" fill="#34D399"/>
  </g>

  <!-- Title & Tagline -->
  <text x="138" y="95" fill="#0F172A" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">Younghwan Chae — Résumé</text>
  <text x="56" y="156" fill="#334155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">ML, numerical optimization &amp; Physical AI · automated LaTeX PDFs.</text>

  <!-- Tech pills -->
  <rect x="56" y="186" width="212" height="32" rx="16" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1"/>
  <text x="162" y="207" text-anchor="middle" fill="#3730A3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">LaTeX · Engineer &amp; Quant</text>

  <rect x="280" y="186" width="166" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="363" y="207" text-anchor="middle" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">EN / KO · CI PDF</text>

  <!-- Right Artwork: LaTeX CV Layout -->
  <g>
    <!-- Back shadow sheet (Quant variant) -->
    <rect x="920" y="46" width="196" height="206" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="940" y="64" width="90" height="8" rx="4" fill="#94A3B8"/>
    <rect x="940" y="84" width="150" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="940" y="96" width="130" height="5" rx="2.5" fill="#CBD5E1"/>

    <!-- Front main CV sheet -->
    <rect x="706" y="30" width="246" height="222" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
